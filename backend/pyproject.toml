[project]
name = "novela"
version = "0.1.0"
description = "CLI determinista y API de solo lectura del harness de novelas de suspense"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ebooklib>=0.20",
    "fastapi>=0.141.1",
    "filelock>=3.13",
    "fonttools>=4.66.0",
    "fpdf2>=2.8.8",
    "markdown-it-py>=4.2.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "uvicorn>=0.53.0",
]

[project.scripts]
novela = "novela.cli:app"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "hypothesis>=6.100",
    "jsonschema>=4.22",
    "mutmut>=2.5,<3",
    "mypy>=1.10",
    "pypdf>=6.19.0",
    "pytest>=8.2",
    "ruff>=0.5",
    "types-jsonschema>=4.26.0.20260518",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["novela"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# S = flake8-bandit (validators.md §3.2): nadie escribe un open(..., "w") suelto sobre el workspace.
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["S101"]
"tests/**" = ["S101"]
"conftest.py" = ["S101"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# ebooklib no publica tipos.
module = ["ebooklib", "ebooklib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# fonttools tampoco: pdf.py lee con él el cmap de la fuente embebida.
module = ["fontTools", "fontTools.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["novela", "tests"]
addopts = "-q"

[tool.mutmut]
# validators.md §3.7: solo sobre los gates y apply; en el resto del backend es caro y poco
# informativo. Sin mutar cadenas: un mensaje distinto no es un gate decorativo.
# En Windows, con PYTHONUTF8=1 (mutmut imprime emojis).
paths_to_mutate = "novela/slices/validacion/gates.py,novela/slices/delta/apply.py"
# -B: sin bytecode rancio. `and 1`: mutmut 2 solo cuenta como muerto el código 1, y un
# mutante que ni compila hace salir a pytest con 2 o 4. Sin `|| exit 1`: fuera de Windows
# mutmut parte el runner con shlex y lo lanza sin shell.
runner = '''python -B -c "import sys, pytest; sys.exit(pytest.main(['-x', '-q', '-p', 'no:cacheprovider', 'novela/slices/validacion/test_gates.py', 'novela/slices/delta/test_apply.py']) and 1)"'''
tests_dir = "novela/slices/"
disable_mutation_types = "string,fstring"
