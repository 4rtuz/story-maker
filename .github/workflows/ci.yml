name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run mypy --strict .
      - run: uv run pytest --hypothesis-profile=ci
      # CA-15: ningún mutante vivo en los gates. El código de salida es una máscara: 1 fatal,
      # 2 supervivientes, 4 timeout, 8 sospechosos (mueren, pero tarde). Solo 1 y 2 fallan.
      - run: uv run mutmut run || test $(( $? & 3 )) -eq 0
